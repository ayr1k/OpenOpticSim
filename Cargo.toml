[workspace]
members = ["crates/optics", "crates/cli", "src-tauri"]
default-members = ["crates/optics", "crates/cli"]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Keep interactive numerical previews usable in the development desktop bridge.
[profile.dev.package.openoptics]
opt-level = 2

